info:
  name: "Setup: enable client C (200)"
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/api/clients/{{disableClientId}}/enable"
  headers:
    - name: X-Internal-Access-Key
      value: "{{adminKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 — client enabled", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("the view no longer carries disabledAt", function() {
          expect(res.getBody().clientId).to.equal(bru.getVar("disableClientId"));
          expect(res.getBody()).to.not.have.property("disabledAt");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Setup, expected: 200.** Enables client C again. Its key was never rotated, so
  the same key must work now (`20`).
