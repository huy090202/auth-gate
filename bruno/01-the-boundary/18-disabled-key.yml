info:
  name: "Disabled client's key (401)"
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/api/factors/{{subjectId}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{disableClientKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("401 — a disabled client's key is refused", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test('body is exactly {"error":"unauthorized"}, same as an unknown key', function() {
          expect(res.getBody()).to.deep.equal({ error: "unauthorized" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The key of the client disabled in `17`, on a verify route. **Expected: 401.**

  The body is byte-identical to `02-wrong-key`, so a caller cannot tell a disabled
  client from a key that never existed. Harmless on prd.
