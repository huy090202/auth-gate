info:
  name: "Portal key on an admin route (401)"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/clients"
  headers:
    - name: X-Internal-Access-Key
      value: "{{portalKey}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("portalKey")) bru.runner.skipRequest();
    - type: tests
      code: |-
        test("401 — the portal key does not open admin routes", function() {
          expect(res.getStatus()).to.equal(401);
        });
        
        test('body is exactly {"error":"unauthorized"}', function() {
          expect(res.getBody()).to.deep.equal({ error: "unauthorized" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Expected: 401.** The portal key cannot list or manage clients as an operator.
