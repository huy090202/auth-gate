info:
  name: "Another tenant's client (404)"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/portal/clients/{{portalClientId}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{portalKey}}"
    - name: X-Tenant-Id
      value: "01KAZ5XQ3W5D8F1G4H7J0K2M3P"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("portalKey")) bru.runner.skipRequest();
    - type: tests
      code: |-
        test("404 — not found, not forbidden", function() {
          expect(res.getStatus()).to.equal(404);
        });
        
        test('body is exactly {"error":"client_not_found"}', function() {
          expect(res.getBody()).to.deep.equal({ error: "client_not_found" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Expected: 404 `client_not_found`.** Tenant B asks for tenant A's client. The
  answer is the same as for an unknown id, so ids cannot be probed across tenants.
