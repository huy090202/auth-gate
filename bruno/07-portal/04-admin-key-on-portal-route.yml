info:
  name: "Admin key on a portal route (401)"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/portal/clients"
  headers:
    - name: X-Internal-Access-Key
      value: "{{adminKey}}"
    - name: X-Tenant-Id
      value: "01KAZ5XQ3V8M2N7R4T6W9Y0B1C"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("portalKey")) bru.runner.skipRequest();
    - type: tests
      code: |-
        test("401 — the admin key does not open portal routes", function() {
          expect(res.getStatus()).to.equal(401);
        });
        
        test('body is exactly {"error":"unauthorized"}', function() {
          expect(res.getBody()).to.deep.equal({ error: "unauthorized" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Expected: 401.** Neither key opens the other's routes.
