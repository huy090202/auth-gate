info:
  name: "Tenant patches rateLimit (400)"
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/portal/clients/{{portalClientId}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: X-Internal-Access-Key
      value: "{{portalKey}}"
    - name: X-Tenant-Id
      value: "01KAZ5XQ3V8M2N7R4T6W9Y0B1C"
  body:
    type: json
    data: |-
      {
        "rateLimit": { "burst": 5000, "perSecond": 5000 }
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("portalKey")) bru.runner.skipRequest();
    - type: tests
      code: |-
        test("400 — a tenant cannot tune its limit", function() {
          expect(res.getStatus()).to.equal(400);
        });
        
        test('body is {"error":"invalid_client"}', function() {
          expect(res.getBody().error).to.equal("invalid_client");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Expected: 400 `invalid_client`.** Only an operator changes a client's rate limit.
