info:
  name: "An operator's client as tenant A (404)"
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/portal/clients/{{clientId}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{portalKey}}"
    - name: X-Tenant-Id
      value: "01KAZ5XQ3V8M2N7R4T6W9Y0B1C"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("portalKey") || !bru.getVar("clientId")) bru.runner.skipRequest();
    - type: tests
      code: |-
        test("404 — not found, not forbidden", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test('body is exactly {"error":"client_not_found"}', function() {
          expect(res.getBody()).to.deep.equal({ error: "client_not_found" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Expected: 404 `client_not_found`.** Tenant A asks for the operator client `02-clients/01-create` made (`clientId`). A client with no owner answers exactly like an unknown id.
