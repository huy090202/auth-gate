info:
  name: "Get the client as tenant A (200)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/portal/clients/{{portalClientId}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{portalKey}}"
    - name: X-Tenant-Id
      value: "01KAZ5XQ3V8M2N7R4T6W9Y0B1C"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("portalKey")) bru.runner.skipRequest();
    - type: tests
      code: |-
        test("200 — the owner sees it", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("the requested rateLimit was ignored: burst 20, perSecond 10", function() {
          expect(res.getBody().rateLimit).to.deep.equal({ burst: 20, perSecond: 10 });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Expected: 200.** The owning tenant reads its own client, which carries the forced
  rate limit (burst 20, perSecond 10) whatever the create body asked for.
