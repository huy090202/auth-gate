info:
  name: "Setup: patch the bucket to burst 1, 0.01/s (200)"
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/clients/{{rlClientId}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: X-Internal-Access-Key
      value: "{{adminKey}}"
  body:
    type: json
    data: |-
      {
        "rateLimit": { "burst": 1, "perSecond": 0.01 }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 — client updated", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("the new bucket is echoed", function() {
          expect(res.getBody().rateLimit).to.deep.equal({ burst: 1, perSecond: 0.01 });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Setup, expected: 200.** Shrinks the throwaway client's bucket to one token
  that refills once every 100 seconds, so the next two requests are
  deterministic. This is how an operator tunes a client without a deploy.
