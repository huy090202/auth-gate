info:
  name: "Delete boundary C (204 or 404)"
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/clients/{{tdBoundaryC}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{adminKey}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("tdBoundaryC")) bru.runner.skipRequest();
    - type: tests
      code: |-
        test("204 deleted, or 404 already gone", function() {
          expect([204, 404]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Deletes the client saved as `tdBoundaryC`. Skipped when the variable is unset (the request that creates it did not run or did not return 201).
