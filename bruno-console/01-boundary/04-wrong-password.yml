info:
  name: "Wrong password (401, same body)"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      { "username": "{{username}}", "password": "not-the-password-1" }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("username")) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("401", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test("the same body as an unknown user", function() {
          expect(JSON.stringify(res.getBody())).to.equal(bru.getVar("unknownUserBody"));
        });

        test("no session cookie is set", function() {
          const c = res.getHeader("set-cookie");
          expect(c === undefined || c === null || String(c).length === 0, "a cookie was set").to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
  maxRedirects: 0

docs: |-
  **Expected: 401, byte for byte the answer of the previous request.** A wrong password
  on a real account must not be told apart from an unknown name.

  This request needs a real account, so it is skipped when `username` is empty
  (which is the case in `smoke.sh`). Run by hand, it counts as one failed sign-in
  for that account; the next good sign-in resets the count.
