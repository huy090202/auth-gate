docs:
  content: |-
    ## Every request here is expected to FAIL

    Nothing here needs a credential, and `scripts/console/smoke.sh` runs this folder
    on its own against a deployed stage. Each request fails on purpose; a request
    that succeeds is the bug.

    | request | expected | why it matters |
    | --- | --- | --- |
    | unknown API path | **404** `not_found` JSON | /api never falls through to the SPA page |
    | `text/plain` POST | **415** | a cross-site form post cannot send `application/json` |
    | unknown user | **401** `invalid_credentials` | no hint whether the name exists |
    | wrong password | **401**, the same bytes | only runs when `username` is set |
    | `/api/me` without a cookie | **401** | no session, no data |
    | `/api/tenants` without a cookie | **401** | no session, no tenant list: the operator screens sit behind the session guard |

    Each login attempt spends one token of the per-IP limiter on `/api/auth/*`
    (burst 10, then one per 6 seconds). Run by hand this folder spends two; under
    `smoke.sh` it spends one, because the wrong-password request is skipped. The
    unknown-user login also writes an audit row.
  type: text/markdown
