info:
  name: "List clients (200)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/clients"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("the new client is listed", function() {
          const ids = res.getBody().clients.map((c) => c.clientId);
          expect(ids).to.include(bru.getVar("clientId"));
        });

        test("no key material in a list", function() {
          const body = JSON.stringify(res.getBody()).toLowerCase();
          expect(body).to.not.include("accesskey");
          expect(body).to.not.include("hash");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
  maxRedirects: 0

docs: |-
  **Expected: 200.** The list holds at most a page of clients; the one just made is the
  newest. The list never carries key material.
