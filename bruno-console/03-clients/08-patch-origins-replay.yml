info:
  name: "Replay the spent token (403)"
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/clients/{{clientId}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: x-step-up-token
      value: "{{stepUpToken}}"
  body:
    type: json
    data: |-
      { "origins": ["http://localhost:3000"] }

runtime:
  scripts:
    - type: tests
      code: |-
        test("403", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("step_up_required", function() {
          expect(res.getBody().error).to.equal("step_up_required");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
  maxRedirects: 0

docs: |-
  **Expected: 403.** A step-up token is single-use. Sending the same one again is the
  same answer as sending none.
