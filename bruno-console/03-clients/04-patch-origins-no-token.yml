info:
  name: "Patch origins, no step-up (403)"
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/clients/{{clientId}}"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      { "origins": ["http://localhost:3000", "http://localhost:3001"] }

runtime:
  scripts:
    - type: tests
      code: |-
        test("403", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("step_up_required", function() {
          expect(res.getBody().error).to.equal("step_up_required");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
  maxRedirects: 0

docs: |-
  **Expected: 403 `step_up_required`.** Origins decide where passkeys may be used, so
  changing them asks for a fresh second factor.
