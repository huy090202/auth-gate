info:
  name: "POST /api/tenants without a cookie (401)"
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/tenants"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      { "name": "Acme" }

runtime:
  scripts:
    - type: tests
      code: |-
        test("401", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test('body is {"error":"unauthorized"}', function() {
          expect(res.getBody()).to.deep.equal({ error: "unauthorized" });
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
  maxRedirects: 0

docs: |-
  **Expected: 401.** Creating an organisation spends a person's quota of 3, so it must be refused before the body is read. The session guard answers first: no cookie, no organisation.
