info:
  name: "Sign-up without Turnstile (403)"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/signup"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      { "email": "boundary-check@example.com", "displayName": "Boundary", "password": "a long password for boundary 1", "lang": "en" }

runtime:
  scripts:
    - type: tests
      code: |-
        // The per-IP sign-up limiter (burst 5, then one per 10 minutes) answers before the Turnstile check
        // once an IP has spent its tokens: that refusal passes too.
        test("403 turnstile_failed, or 429 rate_limited once this IP spent its sign-up tokens", function() {
          const s = res.getStatus();
          expect([403, 429]).to.include(s);
          expect(res.getBody()).to.deep.equal({ error: s === 403 ? "turnstile_failed" : "rate_limited" });
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
  maxRedirects: 0

docs: |-
  **Expected: 403 `turnstile_failed`.** The body is valid, the widget token is missing: no
  account is created and no email is sent. It spends one token of the per-IP sign-up limiter
  (burst 5, then one per 10 minutes); an IP that spent them gets 429 `rate_limited`, also accepted.
