info:
  name: "/api/me without a cookie (401)"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/me"

runtime:
  scripts:
    - type: tests
      code: |-
        test("401", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test('body is {"error":"unauthorized"}', function() {
          expect(res.getBody()).to.deep.equal({ error: "unauthorized" });
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
  maxRedirects: 0

docs: |-
  **Expected: 401.** No cookie, no session. Run this folder first: once a sign-in has put a
  cookie in the jar, this request would be answered 200.
