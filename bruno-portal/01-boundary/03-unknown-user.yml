info:
  name: "Unknown account (401)"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      { "email": "no-such-account-xyz@example.com", "password": "not-the-password-1" }

runtime:
  scripts:
    - type: tests
      code: |-
        test("401", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test("invalid_credentials, nothing more", function() {
          expect(res.getBody()).to.deep.equal({ error: "invalid_credentials" });
        });

        test("no session cookie is set", function() {
          const c = res.getHeader("set-cookie");
          expect(c === undefined || c === null || String(c).length === 0, "a cookie was set").to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
  maxRedirects: 0

docs: |-
  **Expected: 401 `invalid_credentials`.** The address is not an account. The server still
  runs one password comparison against a dummy hash, so the answer takes about as long as a
  real one. It counts as one failure for the caller's IP: after two in 15 minutes a sign-in
  needs a Turnstile token and answers 403 `turnstile_required` instead, so do not run this
  folder more than once in 15 minutes.
